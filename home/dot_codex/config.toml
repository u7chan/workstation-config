approval_policy = "on-request"
approvals_reviewer = "auto_review"
sandbox_mode = "workspace-write"

# モデル別のcontext window / auto-compactはmodel catalogで管理する。
# model_context_window / model_auto_compact_token_limitは全モデルへ一様に適用される
# global overrideのため、ここには置かない。設計原則とbudgetの判断理由は
# docs/ai-model-context-budget.mdを参照。
model_catalog_json = "~/.codex/model-catalogs/workstation.json"

[sandbox_workspace_write]
network_access = true

[tui]
status_line = ["model-with-reasoning", "context-remaining", "context-used", "five-hour-limit", "weekly-limit", "context-window-size", "approval-mode"]

[features]
hooks = true
apps = false
