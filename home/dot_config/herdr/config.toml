onboarding = false

[ui]
agent_panel_sort = "spaces"
# パネル枠にエージェントラベルを表示
show_agent_labels_on_pane_borders = true
# タブバー右側ステータス: ホスト名 / エージェント稼働数 / 日時
tab_bar_right = [
  { type = "hostname" },
  { type = "command", command = "~/.config/herdr/scripts/status-agents.sh", interval_seconds = 5, timeout_seconds = 2 },
  { type = "command", command = "~/.config/herdr/scripts/status-datetime.sh", interval_seconds = 5, timeout_seconds = 2 },
]
tab_bar_right_separator = " \ue0b1 "  # NerdFont powerline thin chevron U+E0B1

[theme]
name = "catppuccin"

[keys]
prefix         = "ctrl+q"
split_vertical = "prefix+v"
close_pane     = "ctrl+w"
reload_config  = "prefix+shift+r"

[[keys.command]]
key     = "prefix+y"
type    = "popup"
command = "yazi"
width   = "90%"
height  = "90%"

[[keys.command]]
key     = "prefix+f"
type    = "plugin_action"
command = "herdr-file-viewer.open-file-viewer"

[[keys.command]]
key     = "prefix+d"
type    = "popup"
command = "lazydocker"
width   = "90%"
height  = "90%"

[[keys.command]]
key     = "prefix+g"
type    = "popup"
command = "lazygit"
width   = "90%"
height  = "90%"

[[keys.command]]
key     = "prefix+h"
type    = "shell"
command = "hunk-split.sh"

[[keys.command]]
key     = "prefix+r"
type    = "plugin_action"
command = "persiyanov.reviewr.toggle"
