onboarding = false

[ui]
agent_panel_sort = "spaces"
# パネル枠にエージェントラベルを表示
show_agent_labels_on_pane_borders = true
# タブバー右側ステータス: CPU/メモリ使用率 / エージェント稼働数 / 日時
tab_bar_right = [
  { type = "command", command = "~/.config/herdr/scripts/status-resources.sh", interval_seconds = 1, timeout_seconds = 2 },
  { type = "command", command = "~/.config/herdr/scripts/status-agents.sh", interval_seconds = 1, timeout_seconds = 2 },
  { type = "command", command = "~/.config/herdr/scripts/status-datetime.sh", interval_seconds = 1, timeout_seconds = 2 },
  # 看板の要点（ローカルのみ・ネットワーク禁止）: 確認待ち / PR / 警告
  { type = "command", command = "~/.config/herdr/local-plugins/herdr-status-board/bin/herdr-status-board summary", interval_seconds = 2, timeout_seconds = 2 },
]
tab_bar_right_separator = " \ue0b1 "  # NerdFont powerline thin chevron U+E0B1

[theme]
name = "catppuccin"

[keys]
prefix         = "ctrl+q"
split_vertical = "prefix+v"
close_pane     = "ctrl+w"
reload_config  = "prefix+shift+r"

# prefix+p で選択中スペース（repo root のみ）のワークツリーを作成する
new_worktree   = "prefix+p"
# new_worktree に譲る（既定は prefix+p）
previous_tab   = ""

[[keys.command]]
key     = "prefix+y"
type    = "popup"
command = "yazi"
width   = "90%"
height  = "90%"

[[keys.command]]
key     = "prefix+f"
type    = "plugin_action"
command = "u7chan.file-viewer.open-file-viewer"

[[keys.command]]
key     = "prefix+d"
type    = "popup"
command = "lazydocker"
width   = "90%"
height  = "90%"

[[keys.command]]
key     = "prefix+g"
type    = "popup"
command = "lazygit"
width   = "90%"
height  = "90%"
