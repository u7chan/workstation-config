<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- CJKフォールバックを日本語字形に固定する。
       fonts-wqy-zenheiの/etc/fonts/conf.d/64-wqy-zenhei.confがgeneric familyの
       preferへ中国語フォント（WenQuanYi Zen Hei）を挿すため、そのままだと日本語が
       中国語字形で描画される。lang=jaを条件にしたルール（70-fonts-noto-cjk.confと
       同じ書き方）はChromiumのCJKフォールバックに効かないため、generic familyの
       並びそのもので、WenQuanYi Zen Heiより前に日本語フォントを置く。

       Latinは従来どおりDejaVuを先に残し、CJKだけNoto CJK JPへ落とす。
       詳細はdocs/workstation.mdの「日本語フォント（CJKフォールバック）」を参照。 -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>DejaVu Sans</family>
      <family>Noto Sans CJK JP</family>
    </prefer>
  </alias>

  <alias>
    <family>serif</family>
    <prefer>
      <family>DejaVu Serif</family>
      <family>Noto Serif CJK JP</family>
    </prefer>
  </alias>

  <alias>
    <family>monospace</family>
    <prefer>
      <family>DejaVu Sans Mono</family>
      <family>Noto Sans Mono CJK JP</family>
    </prefer>
  </alias>
</fontconfig>
