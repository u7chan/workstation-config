---
- name: Set up systemd 259 workaround on Ubuntu 26.04 WSL2
  ansible.builtin.import_tasks: systemd_workaround.yml

- name: Install base APT packages
  ansible.builtin.import_tasks: apt.yml

- name: Install toolchain binaries and mise configuration
  ansible.builtin.import_tasks: toolchain.yml

- name: Resolve Herdr and install locked mise tools
  ansible.builtin.import_tasks: mise_tools.yml

- name: Create workstation shell configuration
  ansible.builtin.import_tasks: shell.yml

- name: Install Safe-chain
  ansible.builtin.import_tasks: safe_chain.yml
