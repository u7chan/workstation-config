---
- name: Ensure git config directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/git"
    state: directory
    mode: "0755"

- name: Configure personal git user settings
  ansible.builtin.template:
    src: git_config.j2
    dest: "{{ ansible_facts['user_dir'] }}/.config/git/config"
    mode: "0644"

- name: Install the AI CLI update entrypoint
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../scripts/update-ai"
    dest: "{{ ansible_facts['user_dir'] }}/.local/bin/update-ai"
    mode: "0755"

- name: Install the workstation update command
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../scripts/personal-bin/myupdate"
    dest: "{{ ansible_facts['user_dir'] }}/.local/bin/myupdate"
    mode: "0755"

- name: Configure workstation update selections
  ansible.builtin.template:
    src: myupdate.conf.j2
    dest: "{{ ansible_facts['user_dir'] }}/.config/workstation/myupdate.conf"
    mode: "0644"

- name: Validate personal_ai_tools values
  ansible.builtin.assert:
    that:
      - item in ['codex', 'claude', 'opencode']
    fail_msg: "personal_ai_tools contains invalid value: {{ item }}"
  loop: "{{ personal_ai_tools }}"
  when: personal_ai_tools | length > 0

- name: Update selected AI CLI tools
  ansible.builtin.command:
    argv: >-
      {{
        ['/usr/bin/flock', ansible_facts['user_dir'] + '/.local/state/workstation-update/update.lock',
         ansible_facts['user_dir'] + '/.local/bin/update-ai']
        + (personal_ai_tools | map('regex_replace', '^', '--') | list)
      }}
  environment:
    MISE_CONFIG_FILE: "{{ ansible_facts['user_dir'] }}/.config/mise/config.toml"
    MISE_LOCKED: "1"
  when: personal_ai_tools | length > 0
  changed_when: false

- name: Install personal CLI scripts
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../scripts/personal-bin/{{ item }}"
    dest: "{{ ansible_facts['user_dir'] }}/.local/bin/{{ item }}"
    mode: "0755"
  loop:
    - clp
    - gac
    - gpc
    - http
    - http-lan

# TODO: Remove this migration block after existing workstations have converged.
- name: Check for legacy workstation-update service unit
  ansible.builtin.stat:
    path: "{{ ansible_facts['user_dir'] }}/.config/systemd/user/workstation-update.service"
  register: legacy_workstation_update_unit

- name: Check if systemd user bus is reachable (migration)
  ansible.builtin.command:
    cmd: systemctl --user is-system-running
  register: systemd_user_migration_check
  changed_when: false
  failed_when: false

- name: Stop and disable legacy workstation-update service
  ansible.builtin.systemd_service:
    name: workstation-update.service
    scope: user
    state: stopped
    enabled: false
  when:
    - systemd_user_migration_check.rc == 0
    - legacy_workstation_update_unit.stat.exists

- name: Remove legacy workstation-update service unit
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/systemd/user/workstation-update.service"
    state: absent

- name: Remove legacy workstation-update env file
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/systemd/user/workstation-update.env"
    state: absent

- name: Reload systemd user manager after legacy unit removal
  ansible.builtin.systemd_service:
    daemon_reload: true
    scope: user
  when: systemd_user_migration_check.rc == 0

- name: Remove legacy workstation update commands
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.local/bin/{{ item }}"
    state: absent
  loop:
    - update-workstation
    - watch-update
    - workstation-update-runner
