---
personal_git_user_name: u7chan
personal_git_user_email: 34462401+u7chan@users.noreply.github.com
personal_ai_tools:
  - claude
  - opencode
  - pi
# 自作Herdrプラグインのリンク宣言。プラグイン本体のcloneとbuildは各プラグインのリポジトリが所有し、
# personal roleは「ビルド済みのプラグインをリンクして有効化する」ところだけを管理する。
# 空リストにするとリンク処理をスキップする（--extra-vars '{"personal_herdr_local_plugins":[]}'）。
personal_herdr_local_plugins:
  - id: u7chan.file-viewer
    source: u7chan/herdr-file-viewer
    root: "{{ ansible_facts['user_dir'] }}/workspace/herdr-file-viewer"
    binary: bin/herdr-file-viewer
    build: CGO_ENABLED=0 go build -trimpath -o bin/herdr-file-viewer ./cmd/herdr-file-viewer
