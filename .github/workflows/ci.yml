---
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-slim
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run gitleaks
        run: |
          GITLEAKS_VERSION="8.24.3"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar xz
          ./gitleaks detect --source . --verbose --redact

  static:
    name: static
    runs-on: ubuntu-slim
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install static check dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ansible-core ansible-lint ripgrep jq shellcheck yamllint

      - name: Install pinned chezmoi binary
        run: |
          version="$(awk -F'"' '/^chezmoi_version:/ {print $2}' ansible/vars/main.yml)"
          checksum="$(awk -F'"' '/^chezmoi_checksum:/ {print $2}' ansible/vars/main.yml)"
          url="$(awk -F'"' '/^chezmoi_url:/ {print $2}' ansible/vars/main.yml \
            | sed "s|{{ chezmoi_version }}|${version}|g")"
          curl -sSL "$url" -o /tmp/chezmoi
          echo "${checksum#sha256:}  /tmp/chezmoi" | sha256sum -c -
          sudo install -m 0755 /tmp/chezmoi /usr/local/bin/chezmoi
          chezmoi --version

      - name: Run static checks
        run: |
          ANSIBLE_LOCAL_TEMP=/tmp ./tests/static.sh
